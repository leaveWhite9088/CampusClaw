<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CampusClaw API 文档</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/swagger-ui/swagger-ui.css') }}">
</head>
<body>
  <p style="font-family: sans-serif; margin: 8px 16px;">
    提示：Authorize 里填 <code>Bearer &lt;token&gt;</code>（token 由 POST /api/login 返回的 access_token）。
  </p>
  <div id="swagger-ui"></div>
  <script src="{{ url_for('static', filename='vendor/swagger-ui/swagger-ui-bundle.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/swagger-ui/swagger-ui-standalone-preset.js') }}"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
