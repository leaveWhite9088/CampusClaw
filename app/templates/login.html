<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 · CampusClaw</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 340px; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #1a3a6b; }
    p.sub { color: #888; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 14px; margin: 12px 0 4px; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ccd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 11px; background: #1a5fd0; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #154db0; }
    .error { color: #c0392b; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CampusClaw</h1>
    <p class="sub">面向中小学的教研智能体 · 请登录</p>
    <form method="post">
      <label for="username">用户名</label>
      <input id="username" name="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">登 录</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
