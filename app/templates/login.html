<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · CampusClaw</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body>
  <div class="split">
    <section class="panel-brand">
      <span class="badge">🎓 课程最终项目演示</span>
      <h1>CampusClaw 智能教学平台</h1>
      <p class="tagline">面向中小学的教研智能体：登录 · 权限隔离 · 讲义知识库 · 班级数据边界</p>
      <div class="pill-stack">
        <span class="pill">📚 讲义知识库</span>
        <span class="pill">🔒 跨班隔离与审计</span>
        <span class="pill">📝 材料上传入库</span>
      </div>
    </section>
    <section class="split-side">
      <h2>登录</h2>
      <p class="hint">教师、学生使用账号密码登录；不同账号可体验班级 A、B 的数据隔离。</p>
      <form method="post" id="login-form">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">登 录</button>
      </form>
      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
      <div class="form-error" id="login-error" hidden>用户名或密码错误</div>
      <p class="foot">未登录访问受保护页面将被引导至本页。</p>
    </section>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
        }),
      });
      if (resp.ok) {
        window.location.href = '/materials';
      } else {
        document.getElementById('login-error').hidden = false;
      }
    });
  </script>
</body>
</html>
