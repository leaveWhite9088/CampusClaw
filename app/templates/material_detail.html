<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ material['title'] }} · CampusClaw</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; margin: 0; }
    main { max-width: 760px; margin: 40px auto; background: #fff; border-radius: 10px; padding: 32px 36px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 20px; color: #1a3a6b; }
    p.meta { color: #999; font-size: 13px; }
    a { color: #1a5fd0; }
  </style>
</head>
<body>
  <main>
    <h1>{{ material['title'] }}</h1>
    <p class="meta">班级 {{ material['class_id'] }} · 文件 {{ material['filename'] }} · {{ material['created_at'] }}</p>
    <p><a href="{{ url_for('materials.list_materials') }}">← 返回本班材料列表</a></p>
  </main>
</body>
</html>
