<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ material['title'] }} · CampusClaw</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="brand">CampusClaw · 班级 {{ material['class_id'] }}</span>
    <span class="who"><a href="{{ url_for('materials.list_materials') }}">← 返回本班材料列表</a></span>
  </header>
  <main class="page">
    <div class="card">
      <h2 class="section-title">{{ material['title'] }}</h2>
      <p style="color:var(--muted);font-size:13px;">
        文件 {{ material['filename'] }} · {{ material['created_at'] }}
      </p>
      <p><a class="btn btn-outline" href="{{ url_for('materials.download', material_id=material['id']) }}">下载原文件</a></p>
    </div>
  </main>
</body>
</html>
